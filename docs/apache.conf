# Apache reverse proxy snippet for AED Route Hamburg
# Include this inside the relevant <VirtualHost> block — it is not a standalone config file.
# Requires mod_proxy and mod_proxy_http to be enabled:
#   a2enmod proxy proxy_http

    # API routes — must come before the base path
    ProxyPass        /demos/aed-routing/api/ http://localhost:5000/api/
    ProxyPassReverse /demos/aed-routing/api/ http://localhost:5000/api/

    # All other requests (UI, static assets, healthz)
    ProxyPass        /demos/aed-routing/ http://localhost:5000/
    ProxyPassReverse /demos/aed-routing/ http://localhost:5000/
