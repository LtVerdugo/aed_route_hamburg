<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AED Coverage — Hamburg-Mitte</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-ant-path@1.3.0/dist/leaflet-ant-path.js"></script>
  <script src="https://unpkg.com/leaflet.motion@0.3.2/dist/leaflet.motion.min.js"></script>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>

<div id="sidebar">

  <!-- Header -->
  <div class="sidebar-header">
    <div class="sidebar-title">&#9672; AED Coverage</div>
    <span class="sidebar-badge">Hamburg-Mitte</span>
  </div>

  <!-- Hint -->
  <div class="sidebar-section">
    <div id="hint">
      Walk coverage from each AED &middot; 2 min and 4 min
    </div>
  </div>

  <div class="sidebar-section">
    <button id="btn-demo" onclick="runDemo()">
      ▶ Try demo — Rathaus
    </button>
    <button id="btn-reset" onclick="resetDemo()"
      style="display:none">
      ✕ Reset
    </button>
  </div>

  <div class="sidebar-divider"></div>

  <div id="results" style="display:none">
    <div class="sidebar-section">
      <div id="result-best"></div>
      <button id="btn-compare">Compare routes</button>
      <div id="result-alternatives" style="display:none">
      </div>
    </div>
  </div>

  <div class="sidebar-divider"></div>

  <!-- Layers -->
  <div class="sidebar-section">
    <div class="section-label">Layers</div>
    <div class="toggle-row">
      <span class="toggle-label">AED locations</span>
      <label class="switch">
        <input type="checkbox" id="toggle-aeds" checked/>
        <span class="switch-slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Isochrones</span>
      <label class="switch">
        <input type="checkbox" id="toggle-isochrones"/>
        <span class="switch-slider"></span>
      </label>
    </div>
  </div>

  <div class="sidebar-divider"></div>

  <!-- Legend -->
  <div class="sidebar-section">
    <div class="section-label">Legend</div>
    <div class="legend-row">
      <span class="legend-dot" style="background:rgba(22,163,74,0.5);"></span>
      <span class="legend-label">Isochrone 2 min</span>
    </div>
    <div class="legend-row">
      <span class="legend-dot" style="background:rgba(249,115,22,0.5);"></span>
      <span class="legend-label">Isochrone 4 min</span>
    </div>
  </div>

</div>

<!-- Map -->
<div id="map"></div>

<script src="./app.js"></script>
</body>
</html>
